  const ks = x.keys || [], P = D.profiles || {}, ph = P[String(x.home)], pa = P[String(x.away)];
  if (!ks.length && !ph && !pa) return '';
  const line = (tid, p) => p ? `<li><b>${nm(tid)}</b><small>${esc(p.segna)} ${esc(p.subisce)}</small></li>` : '';
  return `<div class="card"><h3>Dalle partite giocate <small class="muted">come segnano e come subiscono</small></h3>
    ${ks.length ? `<ul class="keys">${ks.map(k => `<li><b>${esc(k.t)}</b><small>${esc(k.x)}</small></li>`).join('')}</ul><h4>In stagione</h4>` : ''}
    <ul class="keys">${line(x.home, ph)}${line(x.away, pa)}</ul>
    <p class="small muted">Dalle letture delle partite giocate (cronaca Opta di ESPN, ${(D.league || {}).cup ? 'xG dalla posizione dei tiri' : 'xG di Understat'}). Descrivono come le squadre segnano e subiscono: il pronostico non le usa.</p></div>`;
}
// il mercato: le quote dei bookmaker trasformate in probabilità, togliendo il loro margine
function mkLine(M, P, h, a) {
  if (!M) return '';
  const ks = ['p1', 'px', 'p2'], k = ks.reduce((b, c) => Math.abs(P[c] - M[c]) > Math.abs(P[b] - M[b]) ? c : b);
  const lab = {p1: `la vittoria di ${nm(h)}`, px: 'il pareggio', p2: `la vittoria di ${nm(a)}`}[k];
  const far = Math.abs(P[k] - M[k]) >= .1;
  return `<p class="small muted" style="margin:8px 0 0">Mercato: quote ${esc(M.src || 'dei bookmaker')} senza il margine del bookmaker.${far
    ? ` <span class="warn">Il pronostico se ne discosta su ${lab}: ${pc(P[k])} contro ${pc(M[k])}.</span> Di solito il mercato sa qualcosa in più (notizie dell'ultima ora, motivazioni), a volte il modello vede qualcosa nei numeri.` : ''}</p>`;
}

// scommesse: le giocate con quota «nella media» (1,40-1,80), le più probabili e quelle con valore (model.bets)
// una giocata: probabilità del modello, quota giusta (1/p), quota vera del bookmaker e valore dove c'è
const betOdds = it => it.odds != null ? `${it.approx ? '≈' : ''}${fx(it.odds, 2)}` : '–';
const VMIN = 0.03;   // valore minimo da segnalare (model.VALUE_MIN)
const betVal = it => it.value != null ? `<span class="bv ${it.value >= VMIN ? 'up' : 'dn'}">${it.value > 0 ? '+' : ''}${Math.round(it.value * 100)}%</span>` : '';
// giocate consigliate: più sicura (1,35-1,50), equilibrata (1,50-1,65), quota più alta (1,65-1,80) (model.picks)
const tierCls = t => t === 'Più sicura' ? 't1' : t === 'Equilibrata' ? 't2' : 't3';
const betRow = (it, bk) => `<div class="brow${bk ? '' : ' nb'}"><span class="bn">${it.tier ? `<em class="tier ${tierCls(it.tier)}">${esc(it.tier)}</em>` : ''}<b>${esc(it.k)}</b><small>${esc(it.g)}${it.pm != null ? ` · modello ${pc(it.pmod)}, bookmaker ${pc(it.pm)}` : ''}</small></span>
    <span class="bp"><i style="width:${Math.round(it.p * 100)}%"></i><em class="num">${pc(it.p)}</em></span>
    <span class="bq num">${fx(it.fair, 2)}</span>${bk ? `<span class="bq num">${betOdds(it)} ${betVal(it)}</span>` : ''}</div>`;
const betHead = bk => `<div class="brow bh${bk ? '' : ' nb'}"><span>Giocata</span><span>Probabilità</span><span>Quota minima</span>${bk ? '<span>Bookmaker</span>' : ''}</div>`;
// la colonna del bookmaker solo se in tabella c'è almeno una quota vera
const betTable = list => { const bk = list.some(it => it.odds != null); return betHead(bk) + list.map(it => betRow(it, bk)).join(''); };
const BET_NOTE = `<b>Quota minima</b> = 1 / probabilità: gioca solo se il bookmaker paga almeno questa quota; sotto, ti paga meno di quanto vale. Le consigliate sono la giocata più probabile di ogni fascia (più sicura 1,35-1,50, equilibrata 1,50-1,65, quota più alta 1,65-1,80), ognuna da un mercato diverso. Esito, doppia chance e pareggio rimborsato: per l'80% probabilità dei bookmaker e per il 20% del modello, quando c'è il mercato (sull'1X2 prevede meglio); gol dal pronostico; tiri, angoli e ammonizioni da una distribuzione tarata su 3.500 partite (quando dice 70%, esce circa il 70% delle volte). <b>Valore</b> = probabilità × quota − 1, solo con la quota vera (1X2 e una linea di gol da ESPN, uno o due giorni prima; ≈ = doppia chance stimata): si segnala dal 3% in su, perché su 3.500 partite i valori del solo modello sopra il 10% hanno perso tra il 9% e il 16% della posta. Linee e conteggi di tiri e angoli cambiano da bookmaker a bookmaker; le ammonizioni sono solo i gialli.`;
function betsCard(P) {
  const B = P.bets;
  if (!B || !(B.items || []).length) return '';
  const inBand = B.items.filter(it => it.fair >= B.lo && it.fair <= B.hi);
  const value = B.items.filter(it => it.value >= (B.vmin ?? VMIN) && it.odds >= B.lo && it.odds <= B.hi).sort((a, b) => b.value - a.value).slice(0, 6);
  const groups = [...new Set(inBand.map(it => it.g))], odds = B.items.some(it => it.odds != null);
  return `<div class="card bets">
    ${(B.picks || []).length ? `<h4 style="margin-top:0">Le giocate consigliate</h4>${betTable(B.picks)}` : ''}
    ${value.length ? `<h4>Con valore secondo modello e bookmaker</h4>${betTable(value)}` : `<p class="small muted">${odds ? 'Nessuna giocata con valore tra quelle di cui c\'è la quota vera del bookmaker.' : 'Quote del bookmaker non ancora pubblicate (di solito arrivano uno o due giorni prima della partita): confronta la quota minima con quella del tuo bookmaker.'}</p>`}
    <details class="acc"><summary>Tutte le giocate in fascia (${inBand.length})</summary>${groups.map(g => `<h4>${esc(g)}</h4>${betTable(inBand.filter(it => it.g === g))}`).join('')}</details>
    ${nota(BET_NOTE, 'Come si leggono quota minima e valore')}
    <p class="small muted">Gioca responsabilmente: vietato ai minori di 18 anni, nessuna previsione è una certezza.</p></div>`;
}

/* chicche statistiche della partita, dalla più particolare alla più semplice (calcolo: chicche.py) */
const CH_LV = [['Rara', 'Le più particolari', 3], ['Curiosa', 'Curiose', 2], ['Semplice', 'Da sapere', 1], ['Ritardo', 'Ritardi statistici', 0]];
const CH_RIT = "Cose che le quote o gli xG davano per probabili e che non sono ancora successe. Attenzione: un ritardo non rende l'evento più probabile. Provato su 10.504 casi delle ultime tre stagioni: dopo lunghe serie l'evento è uscito come dicevano le quote, o un po' meno.";
function chMark(c, h, a) {
  if (c.team) return crest(c.team, true);
  const col = id => { const t = T[id] || {}; return /^#[0-9a-f]{6}$/i.test(t.color || '') ? t.color : '#6C7A72'; };
  return `<span class="crest s ch-both" style="--c1:${col(h)};--c2:${col(a)}" aria-hidden="true"></span>`;
}
function chicheCard(P, h, a) {
  const C = P.chicche || [];
  if (!C.length) return '';
  const pips = n => `<span class="ch-pips" aria-hidden="true">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
  return `<div class="card chic">
    ${CH_LV.map(([lv, title, n]) => {
      const L = C.filter(c => c.lv === lv);
      return L.length ? `<div class="ch-grp${n ? '' : ' ch-rit'}"><h4>${n ? pips(n) : ''}${title}</h4>${n ? '' : `<p class="small muted">${CH_RIT}</p>`}<ul class="ch-list">${L.map(c => `<li>${chMark(c, h, a)}<div><small>${esc(c.cat)}${c.team ? ' · ' + nm(c.team) : ''}</small><p>${esc(c.t)}</p></div></li>`).join('')}</ul></div>` : '';
    }).join('')}
    <p class="small muted">Più è rara, più sta in alto: ogni dato è confrontato con le altre squadre della ${esc(LGN)}. Solo dati veri (ESPN, statistiche della stagione, precedenti, arbitro; per i ritardi quote già giocate e xG di Understat), nessuna stima del modello.</p></div>`;
}

/* partite più gustose: divario ampio, una squadra top e una flop, giocate in fascia con valore (calcolo: model.gustose) */
const gustoLevel = s => s >= 70 ? 'Molto gustosa' : s >= 50 ? 'Gustosa' : 'Interessante';
function gustoCard(g) {
  const f = D.fixtures.find(x => String(x.id) === String(g.id)), fav = g.fav === 'home' ? g.home : g.away;
  const link = f ? `href="#p${g.id}"` : '';
  const sides = `<div class="fx-teams"><div class="side">${team(g.home)}${dots((T[g.home] || {}).form)}</div>
      <div class="pick"><div class="sc num">${pc(g.pb ?? g.pf)}</div><small>${nm(fav)} favorita</small></div>
      <div class="side r">${team(g.away)}${dots((T[g.away] || {}).form)}</div></div>`;
  const bars = f ? `<div style="margin-top:12px">${sched(f.p1, f.px, f.p2)}</div>` : '';
  const fact = `<p class="g-fav"><b>${nm(fav)}</b> vince nel ${pc(g.pf)} dei casi secondo il modello${g.pm != null ? `, nel ${pc(g.pm)} secondo i bookmaker (${esc(g.src || 'ESPN')})` : ''}. Gol attesi <span class="num">${fx(g.lh, 2)}–${fx(g.la, 2)}</span>.</p>`;
  const why = g.why.length ? `<ul class="g-why">${g.why.map(w => `<li class="${w.tf ? 'tf' : ''}">${w.tf ? '<span class="tfb">Top contro flop</span>' : ''}${esc(w.t)}</li>`).join('')}</ul>` : '';
  const warn = (g.mk ? `<p class="g-mk">${esc(g.mk)}</p>` : '') + (g.warn ? `<p class="g-warn"><b>Da tenere d'occhio.</b> ${esc(g.warn)}</p>` : '');
  const value = g.value.length ? `<h4>Con valore secondo modello e bookmaker</h4>${betTable(g.value)}`
    : `<p class="small muted">${g.odds ? 'Nessuna giocata con valore tra quelle di cui c\'è la quota vera del bookmaker.' : 'Quote del bookmaker non ancora pubblicate (di solito arrivano uno o due giorni prima): una giocata conviene se il tuo bookmaker paga più della quota minima.'}</p>`;
  const top = g.top.length ? `<h4>Le giocate consigliate</h4>${betTable(g.top)}` : '';
  return `<article class="card gusto" style="${glowVars(g.home, g.away)}">
    <div class="g-top"><span class="g-score num">${g.score}<small>/100</small></span><span class="g-lvl">${gustoLevel(g.score)}</span><span class="g-when">${when(g.start)}</span></div>
    <div class="g-meter" role="img" aria-label="Punteggio ${g.score} su 100"><i style="width:${g.score}%"></i></div>
    ${sides}${bars}${fact}${why}${warn}
    <div class="bets">${value}${top}</div>
    ${f ? `<a class="more" ${link}>Scheda completa della partita ›</a>` : ''}
  </article>`;
}
function vGustose() {
  const G = D.gustose || [];
  return `<h2>Le partite più gustose <small>in ordine di data</small></h2>
    <p class="lead">Le partite più sbilanciate: una delle migliori della ${esc(LGN)} contro una delle peggiori. Per ognuna le giocate più probabili tra 1,35 e 1,80 e, quando c'è la quota del bookmaker, quelle con valore.</p>
    ${G.length ? `<div class="stack">${G.map(gustoCard).join('')}</div>` : `<div class="card"><p>Nei prossimi giorni nessuna partita ha un divario abbastanza netto: serve la favorita almeno al 55% con almeno due voci «top contro flop», oppure almeno al 65%.</p></div>`}
    ${allPicks()}
    ${nota(`Il punteggio (0-100) è per il 55% il divario, cioè la probabilità della favorita (dal 45% all'80%; per l'80% quella dei bookmaker, quando c'è), e per il 45% i contrasti «top contro flop»: favorita nel 30% migliore della ${esc(LGN)} e avversaria nel 30% peggiore nelle stesse voci (attacco e difesa del modello, xG creati e concessi, punti in casa e fuori, forma, classifica; i numeri della stagione da tre partite in su). Entrano le partite con la favorita almeno al 55% e due contrasti, o almeno al 65%. Il valore delle giocate non conta: su 3.500 partite quello del solo modello non regge contro il bookmaker. Un divario ampio non rende sicura nessuna giocata: una favorita al 75% non vince comunque una partita su quattro.`, 'Come si sceglie')}
    <p class="small muted">Gioca responsabilmente: vietato ai minori di 18 anni.</p>`;
}
// le tre giocate consigliate di una partita, in breve (giornata e pagina gustose)
function pickList(P) {
  const ps = ((P || {}).bets || {}).picks || [];
  if (!ps.length) return '';
  return `<div class="picks"><span class="pkh">Giocate consigliate</span>${ps.map(it => `<span class="pk ${tierCls(it.tier)}"><small>${esc(it.tier)}</small><b>${esc(it.k)}</b><em class="num">${pc(it.p)} · da ${fx(it.fair, 2)}</em></span>`).join('')}</div>`;
}
function allPicks() {
  const fs = D.fixtures.filter(f => f.P && f.P.bets && (f.P.bets.picks || []).length);
  if (!fs.length) return '';
  return `<h2>Le giocate consigliate di tutte le partite <small>quota tra 1,35 e 1,80</small></h2>
    <p class="lead">Tre giocate per partita, da mercati diversi: più sicura (quota 1,35-1,50), equilibrata (1,50-1,65) e quota più alta (1,65-1,80). «Da» è la quota minima: sotto non conviene.</p>
    <div class="list">${fs.map(f => `<a class="card cardlink" href="#p${f.id}"><div class="fx-top"><span>${when(f.start)}</span><span>${nm(f.home)}–${nm(f.away)}</span></div>${pickList(f.P)}</a>`).join('')}</div>`;
}
// richiamo in cima alla giornata: le tre partite più gustose
function gustoTeaser() {
  const G = (D.gustose || []).slice(0, 3);
  if (!G.length) return '';
  return `<a class="card cardlink g-teaser" href="#gustose"><h3>Le partite più gustose</h3>
    ${G.map(g => `<div class="g-line"><span class="g-score num">${g.score}</span><span>${nm(g.home)}–${nm(g.away)}</span><small class="muted">${day(g.start)} · ${nm(g.fav === 'home' ? g.home : g.away)} ${pc(g.pb ?? g.pf)}${g.value.length ? ' · con valore' : ''}</small></div>`).join('')}
    <div class="more">Tutte le partite gustose ›</div></a>`;
}

/* pagina della partita: il pronostico resta aperto; il resto sta in sezioni a tendina chiuse all'inizio, che apre chi le
   vuole (richiesta dell'utente del 23/10/2026). Una sezione aperta resta aperta finché si guarda la stessa partita, anche
   quando i dati si aggiornano e la pagina si ridisegna; un'altra partita parte di nuovo tutta chiusa. */
const SEC_OPEN = new Set();
function secToggle(el, k) { if (el.open) SEC_OPEN.add(k); else SEC_OPEN.delete(k); }
function secGo(key) {   // dai pulsanti in alto: apre la sezione e ci scorre sopra, sotto la parte fissa dell'intestazione
  const d = document.getElementById('sec-' + key);
  if (!d) return;
  d.open = true;
  const hd = document.querySelector('header'), hh = hd && /sticky|fixed/.test(getComputedStyle(hd).position) ? hd.offsetHeight - document.getElementById('nav').offsetTop : 0;
  window.scrollTo({top: d.getBoundingClientRect().top + window.scrollY - hh - 8, behavior: 'smooth'});
}
function secAll(open) { document.querySelectorAll('details.msec').forEach(d => { d.open = open; }); }
// in breve, sotto il pronostico: la giocata più sicura e la chicca più rara
function inBreve(P) {
  const pk = ((P.bets || {}).picks || [])[0], ch = (P.chicche || []).find(c => c.lv !== 'Ritardo');
  if (!pk && !ch) return '';
  return `<div class="inbreve">${pk ? `<div><small>Giocata più sicura</small><b>${esc(pk.k)}</b> <span class="muted">${pc(pk.p)} · da ${fx(pk.fair, 2)}</span></div>` : ''}
    ${ch ? `<div><small>La chicca</small>${esc(ch.t)}</div>` : ''}</div>`;
}
// le sezioni: [chiave, titolo, riga di riassunto visibile da chiusa, contenuto]
function matchSecs(x, P, h, a) {
  const lu = P.lineups, src = srcLabel(lu.confirmed ? 'ufficiale' : lu.home.source)[1];
  const nAbs = ['home', 'away'].reduce((n, k) => { const miss = lu[k].missing || [];
    return n + miss.length + (P.absent[k] || []).filter(z => !miss.some(m => m.id === z.id)).length; }, 0);
  const forms = lu.home.formation && lu.away.formation ? ` · ${esc(lu.home.formation)} contro ${esc(lu.away.formation)}` : '';
  const sc = [...P.players.home, ...P.players.away].filter(p => p.pos !== 'G').sort((u, v) => v.pGoal - u.pGoal)[0];
  const r = P.referee, tone = refTone(r);
  const ref = r && r.name ? `arbitro ${esc(r.name)}${tone ? ` (${tone})` : ''}` : 'arbitro non ancora designato';
  const C = P.chicche || [], cnt = lv => C.filter(c => c.lv === lv).length;
  const chs = [[cnt('Rara'), 'rare', 'rara'], [cnt('Curiosa'), 'curiose', 'curiosa'], [cnt('Semplice'), 'da sapere', 'da sapere'], [cnt('Ritardo'), 'ritardi', 'ritardo']]
    .filter(([n]) => n).map(([n, pl, sg]) => `${n} ${n === 1 ? sg : pl}`).join(' · ');
  const B = P.bets || {}, pk = (B.picks || [])[0], st = P.style;
  return [
    ['gioco', 'Come giocano', st ? `${esc(st.home.arch.name)} contro ${esc(st.away.arch.name)}` : 'stili, chiavi tattiche, statistiche a confronto',
      lessonsCard(x) + clashCard(P, h, a) + keysCard(P, h) + radarCard(h, a) + mirrorCard(h, a) + swCard(h, a)],
    ['formazioni', 'Formazioni e assenti', `${src}${forms} · ${nAbs ? `${nAbs} tra indisponibili e in dubbio` : 'nessuna assenza nota'}`,
      lineupCard(P, 'home', h) + lineupCard(P, 'away', a) + absentCard(P, h, a)],
    ['giocatori', 'Giocatori e arbitro', `${sc ? `${esc(sc.name)} il più probabile marcatore (${pc(sc.pGoal)}) · ` : ''}${ref}`,
      scorersCard(P, h, a) + yellowCard(P, h, a) + refCard(P)],
    ['chicche', 'Chicche statistiche', chs || 'dalla più particolare alla più semplice', chicheCard(P, h, a)],
    ['scommesse', 'Scommesse', pk ? `più sicura: ${esc(pk.k)} (${pc(pk.p)}, da ${fx(pk.fair, 2)})` : `giocate con quota tra ${fx(B.lo ?? 1.35, 2)} e ${fx(B.hi ?? 1.8, 2)}`, betsCard(P)],
    ['come', 'Come funziona', 'da dove viene il pronostico', `<div class="card">${howNote()}</div>`],
  ].filter(z => z[3] && z[3].trim());
}
const secNav = S => `<nav class="secbar" aria-label="Sezioni della partita">${S.map(([k, t]) => `<button type="button" onclick="secGo('${k}')">${t}</button>`).join('')}
  <span class="secall"><button type="button" class="all" onclick="secAll(true)">Apri tutte</button><button type="button" class="all" onclick="secAll(false)">Chiudi tutte</button></span></nav>`;
const secBoxes = (mid, S) => S.map(([k, t, sub, body]) => { const id = `${mid}:${k}`;
  return `<details class="acc msec" id="sec-${k}"${SEC_OPEN.has(id) ? ' open' : ''} ontoggle="secToggle(this, '${id}')">
    <summary><span class="acc-hd"><span class="acc-t">${t}</span><span class="acc-s">${sub}</span></span><span class="acc-ch" aria-hidden="true">›</span></summary>
    <div class="acc-b stack">${body}</div></details>`; }).join('');
// come funziona il pronostico (in fondo alla pagina della partita, nella sua sezione)
function howNote() {
  return `${(D.league || {}).cup ? `<p class="small muted">Come funziona in Champions: la forza di ogni squadra (attacco e difesa) viene da tutte le sue partite degli ultimi tre anni, nel suo campionato e nelle coppe europee, pesate per quanto sono recenti; ogni squadra è avvicinata alla media del suo campionato e le coppe collegano i campionati tra loro. Provato all'indietro sulle 378 partite di Champions 2024/25 e 2025/26: log loss 0,898 contro 1,014 delle frequenze fisse, esito più probabile azzeccato nel 59% dei casi. Forma, accoppiamenti e stili qui non spostano i gol attesi (in coppa le partite sono troppo poche); restano le assenze. Nei ritorni la probabilità di passare il turno tiene conto dell'andata, dei supplementari e dei rigori. Provati anche gli xG al posto dei gol (Understat per i cinque campionati maggiori, la posizione dei tiri per le partite europee): sulle stesse 378 partite non migliorano il pronostico in modo misurabile (0,2%, dentro il margine d'errore), quindi la forza resta calcolata sui gol.</p>` : `<p class="small muted">Come funziona: per ogni squadra si stima la forza in attacco e in difesa rispetto alla media della ${LGN}: per l'80% dagli xG senza rigori creati e concessi, per il 20% dai gol veri, partendo dalla stagione scorsa e dando sempre più peso a quella in corso. Se l'allenatore è cambiato d'estate la stagione scorsa pesa meno; se è cambiato in corsa, le partite di prima contano un quarto. È la combinazione che ha previsto meglio, provata all'indietro su 1520 partite di Serie A e Premier. Poi si corregge per le assenze. Provato su 3500 partite dei cinque campionati maggiori (2024-2026, usando solo le partite giocate prima di ognuna): forma, accoppiamenti e scontro di stili non migliorano il pronostico, quindi li trovi come descrizioni ma non spostano i gol attesi. Le assenze sì: spostano i gol attesi da una squadra all'altra, lasciando uguale il totale. I gol attesi alimentano un modello di Poisson con correzione Dixon-Coles.${LG.noXg ? ' In questo campionato Understat non arriva e ESPN non ha la cronaca tiro per tiro (solo gol, cartellini e cambi): la forza delle squadre viene dai gol e dai tiri in porta, senza xG, e le letture delle partite non ci sono.' : LG.xgEspn ? ' Understat non copre questo campionato: gli xG di squadre e giocatori sono calcolati dalla posizione di ogni tiro nella cronaca Opta di ESPN, con il modello tarato sugli xG di Understat (errore medio 0,29 a partita).' : ''}</p>`}`;
}
function vPartita(id) {
  const x = D.fixtures.find(f => String(f.id) === String(id));
  if (!x || !x.P) return back('giornata', 'Giornata') + '<p class="lead" style="margin-top:14px">Questa partita non è nella fotografia attuale.</p>';
  const P = x.P, h = x.home, a = x.away;
  const [sc, st] = srcLabel(P.lineups.confirmed ? 'ufficiale' : P.lineups.home.source);
  const row = t => D.standings.find(r => r.team === String(t)) || {};
  const S = matchSecs(x, P, h, a);

    ${(f.style || []).length ? `<h4>Tratti distintivi</h4><ul class="sw">${f.style.map(y => `<li><span class="ic nt" aria-hidden="true">●</span><div><b>${esc(y.t)}</b><small>${esc(y.why)}</small></div></li>`).join('')}</ul>` : ''}
    ${xs ? `<h4>Da dove arrivano le occasioni (xG)</h4><div class="bars"><i class="h" style="width:${(xs.F || 0) * 100}%"></i><i class="x" style="width:${(xs.M || 0) * 100}%"></i><i class="a" style="width:${(xs.D || 0) * 100}%"></i></div>

// coppa: probabilità della squadra di arrivare a ogni turno (D.proj)
function pathChips(id) {
  const q = (D.proj || {})[String(id)];
  if (!q || q.win == null) return '';
  const pp = v => v >= .995 ? '100%' : v < .005 ? '–' : pc(v);
  return `<div class="chips">${[['Ottavi', 'r16'], ['Quarti', 'qf'], ['Semifinale', 'sf'], ['Finale', 'final'], ['Vince', 'win']].map(([l, k]) => `<span class="chip">${l} <b>${pp(q[k])}</b></span>`).join('')}</div>`;
}

// Champions: come gioca la squadra secondo i dati ufficiali della UEFA (medie a partita e posizione tra le squadre)
const UEFA_ROWS = [['Intensità', [['km', 'Km percorsi', 1], ['spr', 'Sprint', 0], ['hi', 'Km ad alta intensità', 1], ['kmnp', 'Corsa senza palla (%)', 0]]],
  ['Pressing e recuperi', [['rec', 'Palloni recuperati', 0], ['reco', '… nella metà campo avversaria', 0], ['recohi', 'Recuperi in avanti (%)', 0], ['tkw', 'Contrasti vinti', 0]]],
  ['Pallone', [['poss', 'Possesso (%)', 0], ['pa', 'Passaggi', 0], ['pacc', 'Passaggi riusciti (%)', 0], ['plong', 'Lanci lunghi (%)', 0]]],
  ['Attacco', [['sh', 'Tiri', 1], ['box', 'Tocchi nell\'area avversaria', 0], ['dlv', 'Palloni messi in area', 0], ['cr', 'Cross', 0], ['drbw', 'Dribbling riusciti', 0]]],
  ['Difesa', [['shc', 'Tiri concessi', 1]]]];
// tratti che spiccano (tra le prime 4 o le ultime 4): [chiave, se in alto, se in basso]
const UEFA_TRAITS = [['reco', 'pressa alto: recupera molti palloni nella metà campo avversaria', 'pressa poco in avanti: aspetta più indietro'],
  ['km', 'corre più di quasi tutte', 'corre meno di quasi tutte'], ['spr', 'fa molti sprint', 'fa pochi sprint'],
  ['poss', 'tiene il pallone', 'lascia il pallone agli avversari'], ['plong', 'gioca lungo', 'costruisce corto, con pochi lanci'],
  ['cr', 'cerca molto il cross', ''], ['box', 'sta tanto nell\'area avversaria', 'arriva poco nell\'area avversaria'],
  ['shc', 'concede molti tiri', 'concede pochissimi tiri']];
function uefaTeamCard(id) {
  const u = (D.uefaTeams || {})[String(id)];
  if (!u || !u.n) return '';
  const N = u.N, rk = u.rk || {}, a = u.avg || {};
  const traits = UEFA_TRAITS.map(([k, hi, lo]) => rk[k] && rk[k] <= 4 && hi ? hi : rk[k] && rk[k] > N - 4 && lo ? lo : '').filter(Boolean);
  return `<div class="card"><h3>Come gioca in Champions <small class="muted">dati ufficiali UEFA</small></h3>
    ${traits.length ? `<p>${nm(id)} ${traits.slice(0, 4).join('; ')}.</p>` : ''}
    ${UEFA_ROWS.map(([g, rows]) => `<h4>${g}</h4><div class="tw"><table><tbody>${rows.filter(([k]) => a[k] != null).map(([k, l, dd]) => `<tr><td class="l">${l}</td><td><b>${fx(a[k], dd)}</b></td><td class="l muted">${rk[k]}ª su ${N}</td></tr>`).join('')}</tbody></table></div>`).join('')}
    <p class="small muted">Medie a partita in ${u.n} ${u.n === 1 ? 'partita' : 'partite'} di questa Champions, dal tracciamento e dalle statistiche ufficiali della UEFA (uefa.com). Posizione: 1ª = il valore più alto.${u.n < 3 ? ' Con così poche partite i numeri cambiano ancora molto.' : ''}</p></div>`;
}

/* scheda del giocatore */
let PL = {};   // giocatori per id (statistiche della stagione)
const POSN = {G: 'Portiere', D: 'Difensore', M: 'Centrocampista', F: 'Attaccante'};
const POSP = {G: 'portieri', D: 'difensori', M: 'centrocampisti', F: 'attaccanti'};
const backAny = `<a class="back" href="#cerca" onclick="if (history.length > 1) { history.back(); return false; }">‹ Indietro</a>`;
// la prossima partita della sua squadra: se è tra i titolari previsti le sue previsioni, se no panchina o assenza
function nextOf(id, tid) {
  const f = D.fixtures.filter(f => f.P && (f.home === tid || f.away === tid)).sort((a, b) => a.start - b.start)[0];
  if (!f) return null;
  const k = f.home === tid ? 'home' : 'away', lu = f.P.lineups[k] || {}, same = x => String(x.id) === String(id);
  return {f, k, p: f.P.players[k].find(same), sub: (lu.subs || []).find(same), miss: (lu.missing || []).find(same),
          pct: lu.pct ? lu.pct[id] : null};
}
// squadra di un giocatore che non ha ancora minuti in stagione: dalle formazioni previste
function teamFromFixtures(id) {
  for (const f of D.fixtures) for (const k of ['home', 'away'])
    if (f.P && f.P.players[k].some(x => String(x.id) === String(id))) return {tid: String(f[k]), name: f.P.players[k].find(x => String(x.id) === String(id)).name};
  return null;
}
function vGiocatore(id) {
  const p = PL[String(id)], alt = p ? null : teamFromFixtures(id);
  if (!p && !alt) return backAny + '<p class="lead" style="margin-top:14px">Questo giocatore non è nella fotografia attuale.</p>';
  const tid = p ? p.t : alt.tid, name = p ? p.n : alt.name, nx = nextOf(id, tid);
  const pos = (p ? p.pos : nx && nx.p && nx.p.pos) || 'M';
  let season = '<p class="small muted">Nessun minuto giocato in questa stagione.</p>', kpis = '', vote = '';
  if (p) {
    const ap = p.ap || 0, gk = pos === 'G';
    // i numeri di Opta si contano sulle partite che Opta ha già (si aggiorna una volta al giorno: può averne una in meno)
    const OPTA = ['tk', 'itc', 'rec', 'gw', 'gd', 'aw', 'ad', 'pcar', 'gp', 'xgot'];
    const apOf = k => OPTA.includes(k) && p.mo && p.min ? ap * p.mo / p.min : ap;
    const avg = (k, d) => apOf(k) && p[k] != null ? fx(p[k] / apOf(k), d) : '–';
    // posizione ogni 90 minuti tra i giocatori dello stesso ruolo che hanno giocato abbastanza
    const maxMin = Math.max(...D.players.map(x => x.min || 0)), minQ = Math.max(180, .3 * maxMin), enough = (p.min || 0) >= minQ;
    const peers = D.players.filter(x => x.pos === pos && (x.min || 0) >= minQ);
    const r90 = (x, k) => { const m = OPTA.includes(k) && x.mo ? x.mo : x.min; return m && x[k] != null ? x[k] / m * 90 : null; };
    const ratio = (x, w, n) => x[n] ? x[w] / x[n] : null;
    const bar = val => {
      if (!enough || val == null) return '<span class="sbar off" aria-hidden="true"></span>';
      const vals = peers.map(x => val.f(x)).filter(v => v != null);
      const below = vals.filter(v => v < val.v).length, rank = vals.filter(v => v > val.v).length + 1, q = vals.length ? below / vals.length : 0;
      return `<span class="sbar" role="img" aria-label="${rank}° su ${vals.length} ${POSP[pos]}" title="${rank}° su ${vals.length} ${POSP[pos]} ogni 90 minuti"><i style="width:${Math.max(4, q * 100)}%"></i></span>`;
    };
    // [chiave, nome, decimali del totale, decimali della media]
    const GROUPS = gk
      ? [['Porta', [['sv', 'Parate', 0, 1], ['gc', 'Gol subiti', 0, 2], ['cs', 'Porta inviolata', 0, 'pct'], ['gp', 'Gol evitati (Opta)', 2, 2], ['xgot', 'xG nello specchio subiti (Opta)', 1, 2]]],
         ['Disciplina', [['yc', 'Ammonizioni', 0, 2], ['rc', 'Espulsioni', 0, 2]]]]
      : [['Attacco', [['g', 'Gol', 0, 2], ['xg', 'xG, gol attesi', 2, 2], ['sh', 'Tiri', 0, 1], ['sot', 'Tiri in porta', 0, 1],
          ['a', 'Assist', 0, 2], ['xa', 'xA, assist attesi', 2, 2], ['kp', 'Chance create', 0, 1]]],
         ['Duelli e recuperi (Opta)', [['tk', 'Contrasti', 0, 1], ['itc', 'Intercetti', 0, 1], ['rec', 'Palloni recuperati', 0, 1],
          ['gw', 'Duelli a terra vinti', 'duel', 'gd'], ['aw', 'Duelli aerei vinti', 'duel', 'ad'], ['pcar', 'Conduzioni progressive', 0, 1]]],
         ['Falli e cartellini', [['fo', 'Falli fatti', 0, 1], ['fd', 'Falli subiti', 0, 1], ['yc', 'Ammonizioni', 0, 2], ['rc', 'Espulsioni', 0, 2]]]];
    const row = ([k, l, dt, da]) => {
      if (p[k] == null) return '';
      let tot, per, b;
      if (dt === 'duel') {   // vinti su giocati, e la percentuale
        const n = p[da];
        if (!n) return '';
        tot = `${fx(p[k], 0)}<small>/${fx(n, 0)}</small>`;
        per = `${Math.round(p[k] / n * 100)}%`;
        b = bar({v: ratio(p, k, da), f: x => ratio(x, k, da)});
      } else if (da === 'pct') {
        tot = fx(p[k], 0);
        per = ap ? `${Math.round(p[k] / ap * 100)}%` : '–';
        b = bar({v: ap ? p[k] / ap : null, f: x => x.ap ? (x[k] || 0) / x.ap : null});
      } else {
        tot = fx(p[k], dt);
        per = avg(k, da);
        b = bar({v: r90(p, k), f: x => r90(x, k)});
      }
      return `<div class="srow"><span class="sl">${l}</span><b class="st num">${tot}</b><span class="sa num">${per}</span>${b}</div>`;
    };
    const groups = GROUPS.map(([title, rows]) => {
      const body = rows.map(row).join('');
      return body ? `<div class="sgrp"><h4>${title}</h4>${body}</div>` : '';
    }).join('');
    const per = (k, d) => ap ? fx((p[k] || 0) / ap, d) : '–';
    const K = gk
      ? [['Presenze', fx(ap, 0), p.st != null ? `${p.st} da titolare` : ''], ['Minuti', fx(p.min, 0), ap ? `${per('min', 0)}' a partita` : ''],
         ['Parate', fx(p.sv, 0), `${per('sv', 1)} a partita`], ['Gol subiti', fx(p.gc, 0), `${per('gc', 2)} a partita`]]
      : [['Presenze', fx(ap, 0), p.st != null ? `${p.st} da titolare` : ''], ['Minuti', fx(p.min, 0), ap ? `${per('min', 0)}' a partita` : ''],
         ['Gol', fx(p.g, 0), `${per('g', 2)} a partita`], ['Assist', fx(p.a, 0), `${per('a', 2)} a partita`]];
    kpis = `<div class="ph-kpis">${K.map(([l, v, sub]) => `<div><small>${l}</small><b class="num">${v}</b><small>${sub}</small></div>`).join('')}</div>`;
    if (p.mv != null) vote = `<div class="ph-vote"><b class="num">${fx(p.mv, 2)}</b><small>media voto</small>${p.fm != null ? `<small>FM ${fx(p.fm, 2)}</small>` : ''}</div>`;
    const tra = `tra ${pos === 'F' ? 'gli' : 'i'} ${POSP[pos]}`;
    season = `<div class="shead"><span></span><span>Totale</span><span>A partita</span><span>Pari ruolo</span></div>${groups}
      <p class="small muted">A partita: media sulle ${fx(ap, 0)} presenze. La barra dice dove si colloca ogni 90 minuti ${tra} con almeno
      ${Math.round(minQ)} minuti (più piena = ne fa di più)${enough ? '' : `; con meno di ${Math.round(minQ)} minuti il confronto non c'è`}.
      Dati di ESPN${LG.noXg ? '' : LG.xgEspn || LG.cup ? ', xG dalla posizione dei tiri' : ', Understat'}${p.tk != null || p.gp != null ? ', Opta (Opta Analyst)' : ''}${p.mv != null ? ' e Fantacalcio.it' : ''}.</p>`;
  }
  let next = '';
  if (nx && !nx.p) {
    const {f, k, sub, miss, pct} = nx, opp = k === 'home' ? f.away : f.home, conf = f.P.lineups.confirmed, src = srcLabel(conf ? 'ufficiale' : f.P.lineups[k].source)[1];
    const why = miss ? `<span class="st ko">${esc(miss.why || 'Indisponibile')}</span>${miss.desc ? ` <span class="muted">${esc(miss.desc)}</span>` : ''}`
      : sub ? `In panchina${pct ? ` (${pct}% di giocare secondo ${LG.fantacalcio === false ? 'OneFootball' : 'Fantacalcio.it'})` : ''}` : 'Non è tra i titolari previsti';
    next = `<div class="card"><h3>Prossima partita</h3>
      <a class="cardlink" href="#p${f.id}"><div class="fx-top"><span>${when(f.start)}</span><span>${k === 'home' ? 'in casa' : 'in trasferta'}</span></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">contro ${team(opp, true)}</div></a>
      <p class="small">${why} <span class="muted">· ${esc(src.toLowerCase())}</span></p>
      <a class="more" style="display:block;text-decoration:none" href="#p${f.id}">Pronostico della partita ›</a></div>`;
  } else if (nx) {
    const {f, k, p: q} = nx, opp = k === 'home' ? f.away : f.home, conf = f.P.lineups.confirmed;
    const st = [['Minuti previsti', fx(q.min, 0)], ...(pos === 'G' ? [['Parate', fx(q.saves, 1)]] : [['Probabilità di segnare', pc(q.pGoal)], ['Probabilità di assist', pc(q.pAssist)],
      ['Tiri', fx(q.shots, 1)], ['Tiri in porta', fx(q.sot, 1)], ['Chance create', fx(q.kp, 1)]]), ['Falli fatti', fx(q.fouls, 1)], ['Falli subiti', fx(q.fouled, 1)], ['Rischio giallo', pc(q.pYellow)]];
    next = `<div class="card"><h3>Prossima partita <small class="muted">${conf ? 'formazione ufficiale' : 'titolare previsto'}</small></h3>
      <a class="cardlink" href="#p${f.id}"><div class="fx-top"><span>${when(f.start)}</span><span>${k === 'home' ? 'in casa' : 'in trasferta'}</span></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">contro ${team(opp, true)}</div></a>
      ${q.role ? `<p class="small muted">Ruolo in campo: ${esc(q.role)}</p>` : ''}
      <div class="facts">${st.map(([l, v]) => `<div class="fact"><small>${l}</small><b class="num">${v}</b></div>`).join('')}</div>
      ${q.opp ? `<p class="small">Duello diretto: <b>${esc(q.opp.name)}</b> <span class="muted">${esc(q.opp.role || '')}</span></p>` : ''}
      <a class="more" style="display:block;text-decoration:none" href="#p${f.id}">Pronostico della partita ›</a></div>`;
  } else if (p) {
    next = `<div class="card"><h3>Prossima partita</h3><p class="small muted">Non è tra i titolari previsti delle prossime partite (formazioni probabili o stimate: può cambiare).</p></div>`;
  }
  // in alto la fascia nei colori della lega: nome, ruolo, squadra e i numeri principali con la media a partita
  const num = p && p.num ? `<span class="ph-num num">${esc(p.num)}</span>` : '';
  return `${backAny}
    <article class="card phero" style="margin-top:10px"><div class="ph-band">${num}<div class="ph-main"><div class="ph-role">${POSN[pos] || ''}</div>
      <h2>${esc(name)}</h2><a class="ph-team" href="#s${tid}">${crest(tid, true)}<span>${esc((T[tid] || {}).name || '')}</span></a></div>${vote}</div>${kpis}</article>
    <div class="stack">${next}<div class="card"><h3>Stagione <small class="muted">totale e media a partita</small></h3>${season}</div>${uefaPlayerCard(id, pos)}</div>`;
}

// Champions: statistiche ufficiali della UEFA del giocatore (tracciamento compreso), per 90 minuti con la posizione tra
// i giocatori dello stesso ruolo con almeno 180 minuti
function uefaPlayerCard(id, pos) {
  const U = D.uefaPlayers || {}, u = U[String(id)];
  if (!u || !u.min) return '';
  const p90 = (x, k) => x.min ? (x[k] || 0) / x.min * 90 : null;
  const peers = Object.entries(U).filter(([k, x]) => (x.min || 0) >= 180 && (PL[k] || {}).pos === pos).map(([, x]) => x);
  const enough = u.min >= 180;
  const rk = (f) => enough ? `${peers.filter(x => f(x) > f(u)).length + 1}° su ${peers.length}` : '';
  const rows = [['Km percorsi ogni 90\'', x => p90(x, 'km'), 1], ['Velocità massima (km/h)', x => x.vmax || 0, 1], ['Sprint ogni 90\'', x => p90(x, 'spr'), 1],
    ['Corsa ad alta intensità ogni 90\' (km)', x => p90(x, 'hi'), 2], ['Palloni recuperati ogni 90\'', x => p90(x, 'rec'), 1],
    ['… nella metà campo avversaria', x => p90(x, 'reco'), 1], ['Tocchi ogni 90\'', x => p90(x, 'tch'), 0], ['Passaggi chiave ogni 90\'', x => p90(x, 'kp'), 1]]
    .filter(([, f]) => f(u) != null);
  const pacc = u.pa ? `${Math.round(u.pc / u.pa * 100)}% (${fx(u.pc, 0)} su ${fx(u.pa, 0)})` : '–';
  return `<div class="card"><h3>In Champions <small class="muted">dati ufficiali UEFA</small></h3>
    <div class="facts"><div class="fact"><small>Partite</small><b class="num">${u.n}</b></div><div class="fact"><small>Minuti</small><b class="num">${fx(u.min, 0)}</b></div>
      <div class="fact"><small>Km percorsi</small><b class="num">${fx(u.km, 1)}</b></div><div class="fact"><small>Passaggi riusciti</small><b class="num">${pacc}</b></div></div>
    <div class="tw"><table><tbody>${rows.map(([l, f, dd]) => `<tr><td class="l">${l}</td><td><b>${fx(f(u), dd)}</b></td><td class="l muted">${rk(f)}${enough ? ' ' + POSP[pos] : ''}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">Dal tracciamento ufficiale della UEFA in questa Champions (uefa.com).${enough ? '' : ' Meno di 180 minuti: niente confronto con gli altri.'}</p></div>`;
}

/* ricerca di giocatori e squadre */
let CQ = '';
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function cercaRes() {
  const q = norm(CQ).trim();
  if (q.length < 2) return '<p class="small muted">Scrivi almeno due lettere del nome, del cognome o della squadra.</p>';
  const teams = D.standings.filter(r => norm((T[r.team] || {}).name).includes(q));
  const tids = new Set(teams.map(r => r.team));
  const pls = (D.players || []).filter(p => norm(p.n).includes(q) || tids.has(p.t)).sort((a, b) => (norm(b.n).includes(q) - norm(a.n).includes(q)) || (b.min || 0) - (a.min || 0)).slice(0, 40);
  if (!teams.length && !pls.length) return '<p class="small muted">Nessun giocatore o squadra trovati.</p>';
  return `<div class="list evl">${teams.map(r => `<a class="card cardlink ev" href="#s${r.team}">${crest(r.team)}<span class="evn"><b>${nm(r.team)}</b><small>${r.pos}ª in classifica · ${r.pts} punti</small></span><span class="muted">›</span></a>`).join('')}
    ${pls.map(p => `<a class="card cardlink ev" href="#g${p.id}">${crest(p.t, true)}<span class="evn"><b>${esc(p.n)}</b><small>${nm(p.t)} · ${POSN[p.pos] || ''} · ${p.ap ?? 0} presenze${p.g ? ` · ${fx(p.g, 0)} gol` : ''}${p.a ? ` · ${fx(p.a, 0)} assist` : ''}</small></span><span class="muted">›</span></a>`).join('')}</div>`;
}
function vCerca() {
  return `<h2>Cerca</h2><input id="q" class="search" type="search" placeholder="Giocatore o squadra" value="${esc(CQ)}" autocomplete="off" aria-label="Cerca un giocatore o una squadra">
    <div id="qres" style="margin-top:10px">${cercaRes()}</div>`;
}
document.addEventListener('input', e => { if (e.target.id === 'q') { CQ = e.target.value; document.getElementById('qres').innerHTML = cercaRes(); } });

let esel = 0, egrp = 'next', emode = 'tot';   // voce, gruppo (prossima giornata o stagione) e totale/a partita in "In evidenza"

  const E = D.evidenza, SE = E?.season;

    const rows = (pg ? c.pg : c.tot) || [];
    const main = r => pg ? fx(r.pg, 2) : fx(r.tot, c.nd);
    const side = r => c.avg ? `${r.apps} voti` : `${r.apps} presenze · ${pg ? 'totale ' + fx(r.tot, c.nd) : fx(r.pg, 2) + ' a partita'}`;

      <div class="seg" role="group" aria-label="Statistica">${SE.cats.map((x, i) => `<button type="button" data-e="${i}" aria-pressed="${x === c}">${esc(x.l)}</button>`).join('')}</div>
      ${c.avg ? '' : `<div class="seg evm" role="group" aria-label="Totale o media"><button type="button" data-em="tot" aria-pressed="${!pg}">Totale</button><button type="button" data-em="pg" aria-pressed="${pg}">A partita</button></div>`}
      <p class="small muted">${esc(c.d)}${c.avg ? '' : pg ? ', a partita' : ', in totale'}.</p>
      <div class="list evl">${rows.map((r, i) => `<a class="card cardlink ev" href="#g${r.id}">
        <span class="rk num">${i + 1}</span>${crest(r.team, true)}
        <span class="evn"><b>${esc(r.name)}</b><small>${nm(r.team)} · ${side(r)}</small></span>
        <span class="evv num">${main(r)}</span></a>`).join('') || '<p class="muted">Nessun dato.</p>'}</div>
      <p class="small muted">Dati di Understat, ESPN${LG.fantacalcio === false ? '' : ' e Fantacalcio.it'}. Nella media a partita contano solo i giocatori con almeno ${SE.minApps} presenze ${LG.fantacalcio === false ? '' : `(fantamedia e media voto: almeno ${SE.minApps} voti)`}. Tocca un giocatore per aprire la sua scheda.</p>`;
  }
  const c = E.cats[esel] || E.cats[0];
  const val = r => c.u === '%' ? pc(r.v) : fx(r.v, 1);
  return `<h2>In evidenza <small>${E.round ? rname(E.round) : 'prossima giornata'}</small></h2>${tabs}
    <p class="lead">Chi spicca nelle statistiche previste per le partite della giornata: per ogni voce i primi 10.</p>
    <div class="seg" role="group" aria-label="Statistica">${E.cats.map((x, i) => `<button type="button" data-e="${i}" aria-pressed="${x === c}">${esc(x.l)}</button>`).join('')}</div>
    <p class="small muted">${esc(c.d)}.</p>
    <div class="list evl">${c.rows.map((r, i) => `<a class="card cardlink ev" href="#g${r.id}">
      <span class="rk num">${i + 1}</span>${crest(r.team, true)}
      <span class="evn"><b>${esc(r.name)}</b><small>${nm(r.team)} ${r.home ? 'vs' : '@'} ${nm(r.opp)} · ${day(r.start)}${r.official ? ' · <span class="uff">ufficiale</span>' : ''}</small></span>
      <span class="evv num">${val(r)}</span></a>`).join('')}</div>
    <p class="small muted">Solo i titolari previsti. I numeri tengono conto di minuti, avversario, marcatura e arbitro, e si aggiornano con le probabili e poi con le formazioni ufficiali (circa un'ora prima, segnate «ufficiale»). Tocca un giocatore per la sua scheda.</p>`;
}
const VIEWS = {giornata: vGiornata, evidenza: vEvidenza, gustose: vGustose, classifica: vClassifica, squadre: vSquadre, storico: vStorico, cerca: vCerca};
function show(name) {
  // #p123 = partita, #s123 = squadra, #g123 = giocatore, #r123 = com'è andata una partita dello storico
  const m = /^([psgr])(e?-?\d+)$/.exec(name || '');   // le partite nuove di ESPN hanno id come e401875056
  const view = m ? null : VIEWS[name] ? name : 'giornata';
  for (const k of Object.keys(VIEWS)) {
    const el = document.getElementById(k);
    el.hidden = k !== view;
    if (k === view) el.innerHTML = VIEWS[k]();
  }
  const det = document.getElementById('dettaglio');
  det.hidden = !m;
  det.innerHTML = m ? {p: vPartita, s: vSquadra, g: vGiocatore, r: vRivedi}[m[1]](m[2]) : '';
  const cur = m ? {p: 'giornata', s: 'squadre', g: '', r: (D.history.items || []).some(i => String(i.id) === m[2] && i.f) ? 'storico' : 'giornata'}[m[1]] : view;
  document.querySelectorAll('#nav a').forEach(a => a.setAttribute('aria-current', a.dataset.s === cur ? 'page' : 'false'));
  if (m) window.scrollTo(0, 0);
  if (view === 'cerca') { const q = document.getElementById('q'); if (q) q.focus(); }
}
document.addEventListener('click', e => {
  const v = e.target.closest('[data-e]');
  if (v) { esel = +v.dataset.e; document.getElementById('evidenza').innerHTML = vEvidenza(); }
  const g = e.target.closest('[data-eg]');
  if (g && g.dataset.eg !== egrp) { egrp = g.dataset.eg; esel = 0; document.getElementById('evidenza').innerHTML = vEvidenza(); }
  const m = e.target.closest('[data-em]');
  if (m) { emode = m.dataset.em; document.getElementById('evidenza').innerHTML = vEvidenza(); }
});
window.addEventListener('hashchange', () => { if (D) show(location.hash.slice(1)); });
// grafici: toccando (o passando con il mouse su) una zona o un tiro, il suo valore va nella riga sotto il grafico
function chartRead(e) {
  const t = e.target.closest && e.target.closest('[data-tip]'), box = t && t.closest('.chartbox');
  if (!box) return;
  box.querySelector('.chart-read').textContent = t.dataset.tip;
  box.querySelectorAll('.on').forEach(x => x.classList.remove('on')); t.classList.add('on');
}
document.addEventListener('pointerover', chartRead);
document.addEventListener('pointerdown', chartRead);
// l'intestazione resta fissa solo con le sezioni: sale di quanto occupano nome e leghe (cambia con la larghezza)
function fitHeader() { document.documentElement.style.setProperty('--hdr-hide', document.getElementById('nav').offsetTop + 'px'); }
window.addEventListener('resize', fitHeader);
// dalle linguette la sezione nuova parte dall'inizio, con l'intestazione accorciata se lo era già
document.getElementById('nav').addEventListener('click', () => setTimeout(() => {
  const h = document.getElementById('nav').offsetTop;
  if (window.scrollY > h) window.scrollTo(0, h);
}));
const FONTE = {'marcatori (Wikipedia)': 'classifica marcatori (Wikipedia)', 'statistiche': 'Understat', 'letture': 'tiri delle partite (Understat)', 'fantacalcio.it': 'Fantacalcio.it', 'sito': 'pubblicazione del sito',
               'storico': 'copia dello storico', 'designazioni': 'designazioni arbitrali (Fantacalcio.it)',
               'arbitri': 'arbitri della scorsa stagione (Fantacalcio.it)'};
function stamp() {
  // il sito si ripubblica ogni 30 minuti anche senza novità: se l'ora è vecchia, gli aggiornamenti si sono fermati
  const errs = Object.keys(D.errors || {}).map(k => FONTE[k] || k);
  const late = Date.now() / 1000 - D.generatedAt > 70 * 60;
  document.getElementById('stamp').innerHTML = `Aggiornato il ${day(D.generatedAt)}`
    + (late ? `<br><span class="warn">nessun aggiornamento da più di un'ora</span>` : '')
    + (errs.length ? `<br><span class="warn">non risponde: ${esc(errs.join(', '))}</span>` : '')
    + (D.checks ? `<br><a class="ckl" href="#storico" title="Controlli automatici dei dati: il dettaglio è nello storico">${D.checks.ok ? '✓ dati controllati' : `<span class="warn">! ${D.checks.n} dati da verificare</span>`}</a>` : '');
}
async function boot() {
  const box = document.getElementById('giornata');
  try {
    D = JSON.parse(document.getElementById('dati').textContent || 'null');
    if (!D) {
      box.innerHTML = '<p class="lead">Carico i dati…</p>';
      const r = await fetch('dati.json', {cache: 'no-store'});
      if (!r.ok) throw new Error(r.status);
      D = await r.json();
    }
  } catch (e) {
    box.innerHTML = '<p class="lead">I dati non si sono caricati: ricarica la pagina tra qualche secondo.</p>';
    return;
  }
  T = D.teams;
  // lega di questa pagina e collegamenti alle altre (la Serie A in cima al sito, le altre in una sottocartella)
  LG = D.league || {name: 'Serie A', dir: ''}; LGN = LG.name || 'Serie A';
  document.documentElement.dataset.lega = LG.key || 'serie-a';   // colori della lega (sul sito c'è già da sito.prepara)
  // emblema della lega: l'icona della cartella (emblemi.py); nell'anteprima senza icone sparisce
  document.querySelector('.logo').innerHTML = `<img class="emb" src="icona-192.png" alt="" onerror="this.remove()">${esc(LGN)} <span>tascabile</span>`;
  document.querySelector('.logo').classList.toggle('long', LGN.length > 10);
  const up = LG.dir ? '../' : '';
  // leghe principali come pulsanti, i campionati minori (Eredivisie, Portogallo, Turchia) nel menu «Altri»
  const href = l => up + (l.dir ? l.dir + '/' : '') || './', LL = D.leagues || [];
  const minor = LL.filter(l => l.minor), curMinor = minor.find(l => l.dir === LG.dir);
  document.getElementById('leghe').innerHTML = LL.length > 1 ? LL.filter(l => !l.minor).map(l => `<a href="${href(l)}" aria-current="${l.dir === LG.dir ? 'page' : 'false'}">${esc(l.name.replace(/ League$/, ''))}</a>`).join('')   // «Premier», «Champions»
    + (minor.length ? `<select class="altre${curMinor ? ' cur' : ''}" aria-label="Altri campionati" onchange="if (this.value) location.href = this.value">
        ${curMinor ? '' : '<option value="" selected>Altri campionati</option>'}${minor.map(l => `<option value="${href(l)}"${l === curMinor ? ' selected' : ''}>${esc(l.name)}</option>`).join('')}</select>` : '') : '';
  const cur = document.querySelector('.leghe a[aria-current="page"], .leghe select.cur');   // la riga scorre: quella aperta in vista
  if (cur) cur.parentElement.scrollLeft = cur.offsetLeft - 16;
  D.players = D.players || [];
  PL = Object.fromEntries(D.players.map(p => [String(p.id), p]));
  LOGOS = new Set((D.logos || []).map(String));
  MK = Object.fromEntries((D.metrics || []).map(x => [x.k, x]));
  stamp();
  fitHeader();
  document.getElementById('foot').textContent = `Versione tascabile di ${LGN}, aggiornata in automatico ogni 30 minuti. Risultati, classifica, formazioni e statistiche delle partite da ESPN; ${LG.cup ? 'xG dalla posizione dei tiri nella cronaca Opta di ESPN; corsa, pressing, allenatori e migliori in campo dai dati ufficiali UEFA; statistiche dei giocatori nei campionati da Understat' : LG.noXg ? 'niente xG (Understat non copre il campionato e ESPN non ha la cronaca tiro per tiro)' : LG.xgEspn ? 'xG dalla posizione dei tiri nella cronaca Opta di ESPN' : 'xG da Understat'}; ${LG.fantacalcio === false ? 'probabili formazioni da OneFootball; allenatori da Wikipedia' : 'voti, probabili formazioni e designazioni arbitrali da Fantacalcio.it'}. I pronostici sono stime statistiche, non certezze.`;
  show(location.hash.slice(1) || 'giornata');
}
boot();
</script>
