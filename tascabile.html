<title>Serie A Tascabile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F2F5F0;--surface:#FFFFFF;--surface2:#E9EEE7;--ink:#13211A;--ink2:#435249;--muted:#6C7A72;--line:#D8E0D6;
  --accent:#1B7A4B;--home:#2A6FD1;--draw:#A7B0A8;--away:#D95A27;--good:#15803D;--warn:#B7791F;--bad:#C0392B;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--ground:#0C1310;--surface:#131C17;--surface2:#1A251F;--ink:#ECF2ED;--ink2:#BFCBC3;--muted:#8A988F;--line:#24312A;
  --accent:#3DB57A;--home:#5B95EA;--draw:#56615A;--away:#EE7A45;--good:#34C26B;--warn:#E0A63A;--bad:#E26155;}}
:root[data-theme="dark"]{
  color-scheme:dark;--ground:#0C1310;--surface:#131C17;--surface2:#1A251F;--ink:#ECF2ED;--ink2:#BFCBC3;--muted:#8A988F;--line:#24312A;
  --accent:#3DB57A;--home:#5B95EA;--draw:#56615A;--away:#EE7A45;--good:#34C26B;--warn:#E0A63A;--bad:#E26155;}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:baseline;gap:10px;padding-block:12px 6px}
.logo.long{font-size:24px}.logo.long span{display:none}
.leghe{display:flex;gap:6px;padding-block:0 4px}.leghe:empty{display:none}
.leghe a{font-size:12px;font-weight:600;text-decoration:none;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.leghe a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:#fff}
.logo{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.01em;line-height:1}
.logo span{color:var(--accent)}
.stamp{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.stamp .warn{color:var(--warn);font-weight:600}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:4px 10px}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--ink2);font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;padding:4px 12px;border-radius:999px;text-transform:uppercase}
nav a[aria-current="page"]{background:var(--ink);color:var(--ground)}
nav a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:22px 0 10px;text-wrap:balance}
h2 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
.lead{color:var(--ink2);margin:0 0 12px;max-width:62ch}
.crest{--c:#777;display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--cf,#fff);font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.02em;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 14%,transparent)}
.crest.s{width:22px;height:22px;font-size:9px}
.tlogo{width:30px;height:30px;flex:none;border-radius:50%;background:#fff;padding:3px;object-fit:contain;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tlogo.s{width:22px;height:22px;padding:2px}
.team{display:flex;align-items:center;gap:8px;min-width:0}
.team b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--draw)}
.dots i.V{background:var(--good)}.dots i.P{background:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.list{display:grid;gap:10px}
.fx-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.fx-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:10px}
.fx-teams .r{justify-content:flex-end;text-align:right}
.fx-teams .side{display:grid;gap:4px;min-width:0}
.fx-teams .r .team{flex-direction:row-reverse}
.fx-teams .r .dots{justify-self:end}
.pick{text-align:center}
.pick .sc{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.02em}
.pick small{display:block;font-size:12px;color:var(--ink2)}
.bars{display:flex;gap:2px;height:8px;margin-top:12px}
.bars i{display:block;height:100%}
.bars i:first-child{border-radius:4px 0 0 4px}.bars i:last-child{border-radius:0 4px 4px 0}
.bars .h{background:var(--home)}.bars .x{background:var(--draw)}.bars .a{background:var(--away)}
.bl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.clash{margin:10px 0 0;font-size:13px;color:var(--ink2);border-left:3px solid var(--accent);padding-left:10px}
.clash b{color:var(--ink);font-weight:600}
.scorers{margin-top:8px;font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th.l,td.l{text-align:left}
tr:last-child td{border-bottom:0}
.pos{display:inline-block;width:22px;text-align:center;font-weight:600;border-left:3px solid transparent;padding-left:2px}
.z-cl{border-color:var(--home)}.z-el{border-color:var(--away)}.z-co{border-color:var(--accent)}.z-rel{border-color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:middle}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.evl{gap:6px;margin-top:10px}
.seg.evg{margin:0 0 12px}.seg.evg button{font-weight:600}
.seg.evm{margin-top:10px}.seg.evm button{font-size:12px;padding:3px 10px}
.search{width:100%;font:inherit;font-size:16px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.cmp{font-size:13px}.cmp td{white-space:nowrap;padding-inline:3px}.cmp th{padding-inline:3px}
.cmp td small{color:var(--muted);font-size:11px}
.pos-luck{font-weight:600}.pos-luck.up{color:var(--good)}.pos-luck.dn{color:var(--bad)}
.cal{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.cal .tr{height:8px;border-radius:4px;background:var(--surface2);position:relative;overflow:hidden}
.cal .tr i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.cal .tr u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
a.plain{color:inherit;text-decoration:none}
.cardlink.ev{display:flex;align-items:center;gap:10px;padding:10px 14px}
.ev .rk{width:1.5em;text-align:right;color:var(--muted);font-weight:600;flex:none}
.ev .evn{flex:1;min-width:0;display:grid}
.ev .evn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .evn small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .evv{font-family:var(--display);font-weight:700;font-size:20px;flex:none}
.ev .uff{color:var(--good);font-weight:600}
.dims{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 10px;margin-top:10px}
.dim{font-size:11px;color:var(--muted)}
.dim span{display:block;height:5px;border-radius:3px;background:var(--surface2);margin-top:3px;position:relative;overflow:hidden}
.dim span i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.arch{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile small{display:block;font-size:12px;color:var(--muted)}
.tile b{font-family:var(--display);font-size:26px;font-weight:700}
.ok{color:var(--good)}.ko{color:var(--bad)}
.tw{overflow-x:auto}
.muted{color:var(--muted)}
.live{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
footer{font-size:12px;color:var(--muted);margin-top:28px;max-width:62ch}
.cardlink{display:block;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.cardlink:active{background:var(--surface2)}
.more{margin-top:10px;font-size:13px;font-weight:600;color:var(--accent);text-align:right}
a.plain{color:inherit;text-decoration:none}
.back{display:inline-block;margin-top:16px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);text-decoration:none}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:10px}
.stack>*{min-width:0}
#dettaglio .fx-teams{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
#dettaglio .pick{max-width:118px}
#dettaglio .pick small{white-space:normal}
#dettaglio article .fx-teams .team{flex-direction:column;align-items:flex-start;gap:4px}
#dettaglio article .fx-teams .r .team{flex-direction:column;align-items:flex-end}
#dettaglio article .fx-teams .team b{white-space:normal;overflow:visible}
.card h3{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px;text-wrap:balance}
.card h3 small{font-family:var(--body);font-weight:500;font-size:12px;text-transform:none;letter-spacing:0}
.card h4{font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.small{font-size:13px;margin:8px 0 0}
.side{text-decoration:none;color:inherit}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}
.fact{background:var(--surface2);border-radius:10px;padding:8px 10px}
.fact small{display:block;font-size:11px;color:var(--muted)}
.fact b{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.15}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.narr p{margin:0 0 8px;color:var(--ink2);max-width:62ch}
.narr b{color:var(--ink)}
.pbr{display:grid;grid-template-columns:minmax(0,1fr) minmax(64px,96px) 52px 30px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.pbr .lb{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbr .tr{height:6px;border-radius:3px;background:var(--surface2);position:relative}
.pbr .tr i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.pbr .tr i.nt{background:var(--draw)}
.pbr .tr .pv{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.pbr .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pbr .rk{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbr .rk.top{color:var(--good);font-weight:600}.pbr .rk.bot{color:var(--bad);font-weight:600}
.mir{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(92px,auto) minmax(0,1fr) 44px;gap:6px;align-items:center;font-size:12px;padding:3px 0;font-variant-numeric:tabular-nums}
.mir .bl,.mir .br{height:6px;background:var(--surface2);border-radius:3px;position:relative;overflow:hidden}
.mir .bl i{position:absolute;top:0;bottom:0;right:0;background:var(--home)}
.mir .br i{position:absolute;top:0;bottom:0;left:0;background:var(--away)}
.mir .lb{text-align:center;color:var(--ink2)}
.mir .vl{text-align:right;color:var(--ink2)}.mir .vr{text-align:left;color:var(--ink2)}
.mir .w{font-weight:700;color:var(--ink)}
.vsrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vsrow .r{text-align:right}
.sw{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sw li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.sw .ic{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;color:#fff;margin-top:1px}
.sw .ic.up{background:var(--good)}.sw .ic.dn{background:var(--bad)}.sw .ic.nt{background:var(--accent)}
.sw small{display:block;color:var(--muted);font-size:12px}
.keys{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.keys li{border-left:3px solid var(--line);padding-left:10px;font-size:14px}
.keys small{display:block;color:var(--ink2);font-size:12px;margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.sq{display:inline-block;width:8px;height:8px;border-radius:2px}
.adjl{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:4px;font-size:13px}
.adjl .up{color:var(--good);font-weight:600}.adjl .dn{color:var(--bad);font-weight:600}
.heat{display:grid;gap:2px;font-size:11px;font-variant-numeric:tabular-nums}
.heat div{text-align:center;padding:7px 0;border-radius:3px}
.heat .hd{color:var(--muted)}
.scr{display:grid;grid-template-columns:minmax(0,1fr) 90px 40px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.scr .tr{height:6px;border-radius:3px;background:var(--surface2);position:relative;overflow:hidden}
.scr .tr i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.scr b{text-align:right}
.rel{display:grid;gap:12px}
.relrow .k{font-size:12px;color:var(--muted);margin-bottom:2px}
.relrow .v{display:grid;gap:3px;font-size:14px}
.relrow small{color:var(--muted)}
.lu td,.lu th{padding:6px 5px;white-space:nowrap}
.lu .rl{display:block;font-size:11px;color:var(--muted);font-weight:400}
.nextlink,.rowlink{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--accent);font-weight:600;text-decoration:none}
.rowlink{color:inherit;font-weight:400;padding:8px 0;border-bottom:1px solid var(--line)}
.rowlink:last-child{border-bottom:0}
.icona{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:12px;color:var(--muted);max-width:62ch}
.icona img{width:56px;height:56px;border-radius:13px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.18)}
@media (max-width:420px){.pick .sc{font-size:28px}.dims{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){section:not([hidden]){animation:in .2s ease-out}}
@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
</style>

<header><div class="wrap">
  <div class="bar1"><div class="logo">Serie A <span>tascabile</span></div><div class="stamp" id="stamp"></div></div>
  <div class="leghe" id="leghe"></div>
  <nav id="nav" aria-label="Sezioni">
    <a href="#giornata" data-s="giornata">Giornata</a><a href="#evidenza" data-s="evidenza">In evidenza</a><a href="#classifica" data-s="classifica">Classifica</a>
    <a href="#squadre" data-s="squadre">Squadre</a><a href="#storico" data-s="storico">Storico</a><a href="#cerca" data-s="cerca">Cerca</a>
  </nav>
</div></header>

<main class="wrap">
  <section id="giornata"></section>
  <section id="evidenza" hidden></section>
  <section id="classifica" hidden></section>
  <section id="squadre" hidden></section>
  <section id="storico" hidden></section>
  <section id="cerca" hidden></section>
  <section id="dettaglio" hidden></section>
  <footer id="foot"></footer>
  <div class="icona"><img src="icona.png" alt="Icona di Serie A Tascabile per la schermata Home" width="56" height="56">
    <span>Icona per la schermata Home: tieni premuto sull'immagine, scegli «Aggiungi a Foto» e usala nell'app Comandi.</span></div>
</main>

<script id="dati" type="application/json">__DATI__</script>
<script>
let D = null, T = {}, LG = {}, LGN = 'Serie A';   // dati: dentro la pagina (anteprima) oppure nel file dati.json pubblicato accanto
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pc = v => v == null ? '–' : Math.round(v * 100) + '%';
const fx = (v, d = 1) => v == null ? '–' : Number(v).toLocaleString('it-IT', {minimumFractionDigits: d, maximumFractionDigits: d});
const TZ = {timeZone: 'Europe/Rome'};
const when = ts => new Date(ts * 1000).toLocaleString('it-IT', {...TZ, weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
const day = ts => new Date(ts * 1000).toLocaleString('it-IT', {...TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
function lum(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return 0;
  const n = parseInt(m[1], 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; });
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
let LOGOS = new Set();   // squadre con il logo pubblicato accanto alla pagina (sito su GitHub)
function crest(id, small) {
  if (LOGOS.has(String(id))) return `<img class="tlogo${small ? ' s' : ''}" src="loghi/${id}.png" alt="" aria-hidden="true">`;
  const t = T[id] || {}, col = /^#[0-9a-f]{6}$/i.test(t.color || '') ? t.color : '#6C7A72';
  return `<span class="crest${small ? ' s' : ''}" style="--c:${col};--cf:${lum(col) > .45 ? '#13211A' : '#fff'}" aria-hidden="true">${esc((t.code || t.name || '?').slice(0, 3))}</span>`;
}
const team = (id, small) => `<span class="team">${crest(id, small)}<b>${esc((T[id] || {}).name || '?')}</b></span>`;
const dots = f => `<span class="dots" aria-label="Forma: ${esc((f || []).join(' '))}">${(f || []).slice().reverse().map(r => `<i class="${r}"></i>`).join('')}</span>`;

function vGiornata() {
  const byRound = {};
  D.fixtures.forEach(f => (byRound[f.round ?? 'altre'] ??= []).push(f));
  const live = D.live.length ? `<h2>Live <small>al momento della fotografia</small></h2><div class="list">${D.live.map(e => `<div class="card live"><div class="fx-teams">
      <div class="side">${team(e.home)}</div><div class="pick"><div class="sc num">${e.hs ?? 0}–${e.as ?? 0}</div><small>${esc(e.clock || '')}</small></div><div class="side r">${team(e.away)}</div></div></div>`).join('')}</div>` : '';
  const rounds = Object.keys(byRound).sort((a, b) => (+a || 99) - (+b || 99)).slice(0, 2);
  return live + rounds.map(r => `<h2>${r === 'altre' ? 'Prossime partite' : r + 'ª giornata'} <small>pronostici</small></h2>
    <div class="list">${byRound[r].map(f => `<a class="card cardlink" href="#p${f.id}">

    <div class="bars" role="img" aria-label="Pronostico: 1 ${pc(f.p1)}, X ${pc(f.px)}, 2 ${pc(f.p2)}"><i class="h" style="width:${f.p1 * 100}%"></i><i class="x" style="width:${f.px * 100}%"></i><i class="a" style="width:${f.p2 * 100}%"></i></div>
    <div class="bl num"><span>${out === '1' ? '<b>1 · ' + pc(f.p1) + '</b>' : '1 · ' + pc(f.p1)}</span><span>${out === 'X' ? '<b>X · ' + pc(f.px) + '</b>' : 'X · ' + pc(f.px)}</span><span>${out === '2' ? '<b>2 · ' + pc(f.p2) + '</b>' : '2 · ' + pc(f.p2)}</span></div>
    <div class="facts">

      <div class="fact"><small>Risultato indicato</small><b class="num">${f.pick.score.i}–${f.pick.score.j}</b><small>${ev.score != null ? yn(ev.score, ev.score ? 'esatto' : 'non esatto') : ''}</small></div>

      <div class="fact"><small>Over 2,5 previsto</small><b>${pc(f.over25)}</b><small>${ev.over25 != null ? yn(ev.over25, r.hs + r.as > 2 ? 'è finita over' : 'è finita under') : ''}</small></div>
      <div class="fact"><small>Gol/Gol previsto</small><b>${pc(f.btts)}</b><small>${ev.btts != null ? yn(ev.btts, r.hs && r.as ? 'hanno segnato entrambe' : 'non hanno segnato entrambe') : ''}</small></div>
      ${f.cards ? `<div class="fact"><small>Gialli attesi · veri</small><b class="num">${fx(f.cards[0] + f.cards[1], 1)}</b><small>${yReal != null ? 'veri ' + yReal : 'veri in arrivo'}</small></div>` : ''}
    </div>
  </article>
  <div class="stack">
    ${f.pl ? side('home') + side('away') : '<p class="small muted">Per questa partita lo storico ha solo il pronostico, senza le previsioni dei giocatori.</p>'}
    ${f.pl && !Object.keys(rp).length ? '<p class="small muted">Le statistiche dei giocatori arrivano da ESPN poco dopo la fine della partita.</p>' : ''}
    <p class="small muted">In ogni cella prima il previsto al calcio d'inizio (con le formazioni ${f.lineups === 'ufficiale' ? 'ufficiali' : 'di quel momento'}), dopo il punto quello che è successo davvero (ESPN). Min: minuti giocati davvero. Giallo: probabilità prevista e se l'ha preso. Gol: probabilità di segnare e gol fatti.</p>
  </div>`;
}

/* ---------- schede complete: partita e squadra (come sul computer) ---------- */
let MK = {};
const F = id => (T[id] || {}).full || {};
const nm = id => esc((T[id] || {}).name || '?');
const mval = (M, v) => v == null || !M ? '–' : fx(v, M.d) + (M.u === '%' ? '%' : '');
const munit = M => M && M.u === '/p' ? ' a partita' : '';
const rankTxt = (f, k) => `${f.rank[k]}ª su ${D.N}`;
const avg = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const col = (id, homeId) => String(id) === String(homeId) ? 'var(--home)' : 'var(--away)';
const back = (href, label) => `<a class="back" href="#${href}">‹ ${label}</a>`;
const CHG = {possesso: ['Più possesso', 'Meno possesso'], baricentro: ['Baricentro più alto', 'Baricentro più basso'],
  pressing: ['Più pressing', 'Meno pressing'], verticalita: ['Gioco più verticale', 'Gioco meno verticale'],
  ampiezza: ['Più gioco sulle fasce', 'Meno gioco sulle fasce'], transizioni: ['Più ripartenze', 'Meno ripartenze'],
  fisicita: ['Più fisicità', 'Meno fisicità'], ritmo: ['Partite più aperte', 'Partite più chiuse']};
const POSL = {G: 'P', D: 'D', M: 'C', F: 'A'};

function strengths(f) {
  const items = (D.metrics || []).filter(M => M.hi != null && f.z && f.z[M.k] != null);
  return {
    s: items.filter(M => f.z[M.k] >= .75 && f.rank[M.k] <= 5).sort((a, b) => f.z[b.k] - f.z[a.k]).slice(0, 5),
    w: items.filter(M => f.z[M.k] <= -.75 && f.rank[M.k] >= D.N - 4).sort((a, b) => f.z[a.k] - f.z[b.k]).slice(0, 5),
  };
}
const swItem = (f, M, up) => `<li><span class="ic ${up ? 'up' : 'dn'}" aria-hidden="true">${up ? '▲' : '▼'}</span><div><b>${esc(up ? M.S : M.W)}</b><small>${esc(M.l)}: ${mval(M, f.m[M.k])}${munit(M)} · ${rankTxt(f, M.k)}</small></div></li>`;
function srcLabel(src) {
  return src === 'ufficiale' ? ['ok', 'Formazione ufficiale'] : src && src.startsWith('probabile') ? ['mid', 'Formazione probabile'] : ['', 'Formazione stimata'];
}

/* partita */
function narrative(P, h, a) {
  const H = F(h), A = F(a), hn = `<b>${nm(h)}</b>`, an = `<b>${nm(a)}</b>`, out = [];
  const mx = Math.max(P.p1, P.px, P.p2);
  if (P.p1 === mx && P.p1 >= .55) out.push(`${hn} parte nettamente favorita (${pc(P.p1)} di vittoria): il modello vede una differenza di qualità chiara.`);
  else if (P.p1 === mx && P.p1 - P.p2 >= .1) out.push(`Pronostico a favore di ${hn} (${pc(P.p1)}), ma ${an} ha margini per fare risultato: ${pc(P.px + P.p2)} tra pareggio e vittoria esterna.`);
  else if (P.p2 === mx && P.p2 >= .5) out.push(`${an} è favorita anche in trasferta (${pc(P.p2)}): la differenza di rendimento supera il vantaggio del fattore campo.`);
  else if (P.p2 === mx && P.p2 - P.p1 >= .08) out.push(`Leggero favore per ${an} (${pc(P.p2)}), con ${hn} che si affida al fattore campo (${pc(P.p1)}).`);
  else out.push(`Partita molto equilibrata: ${hn} ${pc(P.p1)}, pareggio ${pc(P.px)}, ${an} ${pc(P.p2)}.`);
  if (P.style) {
    const st = P.style, main = st.items.find(i => i.kind === 'rule');
    out.push(`Stili a confronto: ${hn} («${esc(st.home.arch.name)}»${st.home.coach ? `, allenata da ${esc(st.home.coach.name)}` : ''}) contro ${an} («${esc(st.away.arch.name)}»${st.away.coach ? `, allenata da ${esc(st.away.coach.name)}` : ''}).${main ? ' ' + esc(main.text) : ''}`);
  }
  const hp = (H.m || {}).poss, ap = (A.m || {}).poss;
  if (hp != null && ap != null) {
    const poss = clamp((hp + (100 - ap)) / 2 + ((P.style && P.style.poss) || 0), 25, 75);
    if (poss >= 54) out.push(`Controllo del gioco: ${hn} dovrebbe tenere il pallone (circa ${Math.round(poss)}% di possesso), con ${an} costretta a difendersi più bassa.`);
    else if (poss <= 46) out.push(`Controllo del gioco: sarà ${an} a gestire il possesso (circa ${Math.round(100 - poss)}%); ${hn} dovrà soffrire e sfruttare le poche occasioni.`);
    else out.push(`Controllo del gioco: possesso prevedibilmente equilibrato (circa ${Math.round(poss)}% – ${Math.round(100 - poss)}%), la partita si deciderà nei duelli e sulle occasioni.`);
  }
  const e2 = (x, y) => (x != null && isFinite(x) && y != null && isFinite(y)) ? (x + y) / 2 : (isFinite(x) ? x : y);
  const hs = H.s || {}, as = A.s || {}, hN = H.n || 1, aN = A.n || 1;
  const shH = e2(hs.shots / hN, as.shotsAgainst / aN), shA = e2(as.shots / aN, hs.shotsAgainst / hN);
  const coH = e2(hs.corners / hN, as.cornersAgainst / aN), coA = e2(as.corners / aN, hs.cornersAgainst / hN);

/* scheda del giocatore */
let PL = {};   // giocatori per id (statistiche della stagione)
const POSN = {G: 'Portiere', D: 'Difensore', M: 'Centrocampista', F: 'Attaccante'};
const POSP = {G: 'portieri', D: 'difensori', M: 'centrocampisti', F: 'attaccanti'};
const backAny = `<a class="back" href="#cerca" onclick="if (history.length > 1) { history.back(); return false; }">‹ Indietro</a>`;
// la prossima partita della sua squadra: se è tra i titolari previsti le sue previsioni, se no panchina o assenza
function nextOf(id, tid) {
  const f = D.fixtures.filter(f => f.P && (f.home === tid || f.away === tid)).sort((a, b) => a.start - b.start)[0];
  if (!f) return null;
  const k = f.home === tid ? 'home' : 'away', lu = f.P.lineups[k] || {}, same = x => String(x.id) === String(id);
  return {f, k, p: f.P.players[k].find(same), sub: (lu.subs || []).find(same), miss: (lu.missing || []).find(same),
          pct: lu.pct ? lu.pct[id] : null};
}
// squadra di un giocatore che non ha ancora minuti in stagione: dalle formazioni previste
function teamFromFixtures(id) {
  for (const f of D.fixtures) for (const k of ['home', 'away'])
    if (f.P && f.P.players[k].some(x => String(x.id) === String(id))) return {tid: String(f[k]), name: f.P.players[k].find(x => String(x.id) === String(id)).name};
  return null;
}
const P90 = [['xg', 'xG', 2], ['g', 'Gol', 2], ['xa', 'xA', 2], ['kp', 'Chance create', 1], ['sh', 'Tiri', 1], ['sot', 'Tiri in porta', 1],
  ['fo', 'Falli fatti', 1], ['fd', 'Falli subiti', 1], ['yc', 'Gialli', 2]];
function vGiocatore(id) {
  const p = PL[String(id)], alt = p ? null : teamFromFixtures(id);
  if (!p && !alt) return backAny + '<p class="lead" style="margin-top:14px">Questo giocatore non è nella fotografia attuale.</p>';
  const tid = p ? p.t : alt.tid, name = p ? p.n : alt.name, nx = nextOf(id, tid);
  const pos = (p ? p.pos : nx && nx.p && nx.p.pos) || 'M';
  let season = '<p class="small muted">Nessun minuto giocato in questa stagione.</p>';
  if (p) {
    const tiles = [['Presenze', `${p.ap ?? '–'}`, p.st != null ? `${p.st} da titolare` : ''], ['Minuti', fx(p.min, 0), ''],
      ['Gol', fx(p.g, 0), `xG ${fx(p.xg, 1)}`], ['Assist', fx(p.a, 0), `xA ${fx(p.xa, 1)}`], ['Chance create', fx(p.kp, 0), ''],
      ['Tiri', fx(p.sh, 0), `${fx(p.sot, 0)} in porta`], ['Falli fatti', fx(p.fo, 0), `subiti ${fx(p.fd, 0)}`],
      ['Ammonizioni', fx(p.yc, 0), p.rc ? `${p.rc} espulsioni` : ''], ...(pos === 'G' ? [['Parate', fx(p.sv, 0), '']] : []),
      ...(p.mv != null ? [['Media voto', fx(p.mv, 2), p.fm != null ? `fantamedia ${fx(p.fm, 2)}` : '']] : [])];
    // per 90 minuti, con la posizione tra i giocatori dello stesso ruolo che hanno giocato abbastanza
    const maxMin = Math.max(...D.players.map(x => x.min || 0)), minQ = Math.max(180, .3 * maxMin);
    const peers = D.players.filter(x => x.pos === pos && (x.min || 0) >= minQ);
    const r90 = (x, k) => x.min ? (x[k] || 0) / x.min * 90 : null;
    const rows = P90.filter(([k]) => p[k] != null && !(pos === 'G' && k !== 'yc')).map(([k, l, d]) => {
      const v = r90(p, k), enough = (p.min || 0) >= minQ;
      const rank = enough ? peers.filter(x => r90(x, k) > v).length + 1 : null;
      return `<tr><td class="l">${l}</td><td><b>${fx(v, d)}</b></td><td class="l muted">${rank ? `${rank}° su ${peers.length} ${POSP[pos]}` : ''}</td></tr>`;
    }).join('');
    season = `<div class="facts">${tiles.map(([k, v, s]) => `<div class="fact"><small>${k}</small><b class="num">${v}</b>${s ? `<small>${s}</small>` : ''}</div>`).join('')}</div>
      ${rows ? `<h4>Ogni 90 minuti</h4><div class="tw"><table><tbody>${rows}</tbody></table></div>
      <p class="small muted">${(p.min || 0) >= minQ ? `Posizione tra i ${POSP[pos]} con almeno ${Math.round(minQ)} minuti giocati.` : `Ha giocato meno di ${Math.round(minQ)} minuti: niente confronto con gli altri ${POSP[pos]}.`} Dati di Understat, ESPN${p.mv != null ? ' e Fantacalcio.it' : ''}.</p>` : ''}`;
  }
  let next = '';
  if (nx && !nx.p) {
    const {f, k, sub, miss, pct} = nx, opp = k === 'home' ? f.away : f.home, conf = f.P.lineups.confirmed, src = srcLabel(conf ? 'ufficiale' : f.P.lineups[k].source)[1];
    const why = miss ? `<span class="st ko">${esc(miss.why || 'Indisponibile')}</span>${miss.desc ? ` <span class="muted">${esc(miss.desc)}</span>` : ''}`
      : sub ? `In panchina${pct ? ` (${pct}% di giocare secondo Fantacalcio.it)` : ''}` : 'Non è tra i titolari previsti';
    next = `<div class="card"><h3>Prossima partita</h3>
      <a class="cardlink" href="#p${f.id}"><div class="fx-top"><span>${when(f.start)}</span><span>${k === 'home' ? 'in casa' : 'in trasferta'}</span></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">contro ${team(opp, true)}</div></a>
      <p class="small">${why} <span class="muted">· ${esc(src.toLowerCase())}</span></p>
      <a class="more" style="display:block;text-decoration:none" href="#p${f.id}">Pronostico della partita ›</a></div>`;
  } else if (nx) {
    const {f, k, p: q} = nx, opp = k === 'home' ? f.away : f.home, conf = f.P.lineups.confirmed;
    const st = [['Minuti previsti', fx(q.min, 0)], ...(pos === 'G' ? [['Parate', fx(q.saves, 1)]] : [['Probabilità di segnare', pc(q.pGoal)], ['Probabilità di assist', pc(q.pAssist)],
      ['Tiri', fx(q.shots, 1)], ['Tiri in porta', fx(q.sot, 1)], ['Chance create', fx(q.kp, 1)]]), ['Falli fatti', fx(q.fouls, 1)], ['Falli subiti', fx(q.fouled, 1)], ['Rischio giallo', pc(q.pYellow)]];
    next = `<div class="card"><h3>Prossima partita <small class="muted">${conf ? 'formazione ufficiale' : 'titolare previsto'}</small></h3>
      <a class="cardlink" href="#p${f.id}"><div class="fx-top"><span>${when(f.start)}</span><span>${k === 'home' ? 'in casa' : 'in trasferta'}</span></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">contro ${team(opp, true)}</div></a>
      ${q.role ? `<p class="small muted">Ruolo in campo: ${esc(q.role)}</p>` : ''}
      <div class="facts">${st.map(([l, v]) => `<div class="fact"><small>${l}</small><b class="num">${v}</b></div>`).join('')}</div>
      ${q.opp ? `<p class="small">Duello diretto: <b>${esc(q.opp.name)}</b> <span class="muted">${esc(q.opp.role || '')}</span></p>` : ''}
      <a class="more" style="display:block;text-decoration:none" href="#p${f.id}">Pronostico della partita ›</a></div>`;
  } else if (p) {
    next = `<div class="card"><h3>Prossima partita</h3><p class="small muted">Non è tra i titolari previsti delle prossime partite (formazioni probabili o stimate: può cambiare).</p></div>`;
  }
  return `${backAny}
    <article class="card" style="margin-top:10px"><div class="fx-top"><span>${POSN[pos] || ''}</span><a class="plain" href="#s${tid}">${team(tid, true)}</a></div>
      <h2 style="margin:8px 0 0">${esc(name)}</h2></article>
    <div class="stack">${next}<div class="card"><h3>Stagione</h3>${season}</div></div>`;
}

/* ricerca di giocatori e squadre */
let CQ = '';
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function cercaRes() {
  const q = norm(CQ).trim();
  if (q.length < 2) return '<p class="small muted">Scrivi almeno due lettere del nome, del cognome o della squadra.</p>';
  const teams = D.standings.filter(r => norm((T[r.team] || {}).name).includes(q));
  const tids = new Set(teams.map(r => r.team));
  const pls = (D.players || []).filter(p => norm(p.n).includes(q) || tids.has(p.t)).sort((a, b) => (norm(b.n).includes(q) - norm(a.n).includes(q)) || (b.min || 0) - (a.min || 0)).slice(0, 40);
  if (!teams.length && !pls.length) return '<p class="small muted">Nessun giocatore o squadra trovati.</p>';
  return `<div class="list evl">${teams.map(r => `<a class="card cardlink ev" href="#s${r.team}">${crest(r.team)}<span class="evn"><b>${nm(r.team)}</b><small>${r.pos}ª in classifica · ${r.pts} punti</small></span><span class="muted">›</span></a>`).join('')}
    ${pls.map(p => `<a class="card cardlink ev" href="#g${p.id}">${crest(p.t, true)}<span class="evn"><b>${esc(p.n)}</b><small>${nm(p.t)} · ${POSN[p.pos] || ''} · ${p.ap ?? 0} presenze${p.g ? ` · ${fx(p.g, 0)} gol` : ''}${p.a ? ` · ${fx(p.a, 0)} assist` : ''}</small></span><span class="muted">›</span></a>`).join('')}</div>`;
}
function vCerca() {
  return `<h2>Cerca</h2><input id="q" class="search" type="search" placeholder="Giocatore o squadra" value="${esc(CQ)}" autocomplete="off" aria-label="Cerca un giocatore o una squadra">
    <div id="qres" style="margin-top:10px">${cercaRes()}</div>`;
}
document.addEventListener('input', e => { if (e.target.id === 'q') { CQ = e.target.value; document.getElementById('qres').innerHTML = cercaRes(); } });

let esel = 0, egrp = 'next', emode = 'tot';   // voce, gruppo (prossima giornata o stagione) e totale/a partita in "In evidenza"
function vEvidenza() {
  const E = D.evidenza, SE = E?.season;
  const hasNext = !!(E?.cats || []).length, hasSeason = !!(SE?.cats || []).length;
  if (!hasNext && !hasSeason) return `<h2>In evidenza</h2><p class="lead">I giocatori in evidenza compaiono quando è in programma la prossima giornata.</p>`;
  const grp = egrp === 'season' && hasSeason || !hasNext ? 'season' : 'next';
  const tabs = hasNext && hasSeason ? `<div class="seg evg" role="group" aria-label="Classifiche"><button type="button" data-eg="next" aria-pressed="${grp === 'next'}">Prossima giornata</button><button type="button" data-eg="season" aria-pressed="${grp === 'season'}">Stagione</button></div>` : '';
  if (grp === 'season') {
    const c = SE.cats[esel] || SE.cats[0], pg = emode === 'pg' || c.avg;
    const rows = (pg ? c.pg : c.tot) || [];
    const main = r => pg ? fx(r.pg, 2) : fx(r.tot, c.nd);
    const side = r => c.avg ? `${r.apps} voti` : `${r.apps} presenze · ${pg ? 'totale ' + fx(r.tot, c.nd) : fx(r.pg, 2) + ' a partita'}`;
    return `<h2>In evidenza <small>stagione</small></h2>${tabs}
      <p class="lead">Le classifiche della stagione con i dati reali di ${SE.games} giornate: per ogni voce i primi 10.</p>
      <div class="seg" role="group" aria-label="Statistica">${SE.cats.map((x, i) => `<button type="button" data-e="${i}" aria-pressed="${x === c}">${esc(x.l)}</button>`).join('')}</div>
      ${c.avg ? '' : `<div class="seg evm" role="group" aria-label="Totale o media"><button type="button" data-em="tot" aria-pressed="${!pg}">Totale</button><button type="button" data-em="pg" aria-pressed="${pg}">A partita</button></div>`}
      <p class="small muted">${esc(c.d)}${c.avg ? '' : pg ? ', a partita' : ', in totale'}.</p>
      <div class="list evl">${rows.map((r, i) => `<a class="card cardlink ev" href="#g${r.id}">
        <span class="rk num">${i + 1}</span>${crest(r.team, true)}
        <span class="evn"><b>${esc(r.name)}</b><small>${nm(r.team)} · ${side(r)}</small></span>
        <span class="evv num">${main(r)}</span></a>`).join('') || '<p class="muted">Nessun dato.</p>'}</div>
      <p class="small muted">Dati di Understat, ESPN${LG.fantacalcio === false ? '' : ' e Fantacalcio.it'}. Nella media a partita contano solo i giocatori con almeno ${SE.minApps} presenze ${LG.fantacalcio === false ? '' : `(fantamedia e media voto: almeno ${SE.minApps} voti)`}. Tocca un giocatore per aprire la sua scheda.</p>`;
  }
  const c = E.cats[esel] || E.cats[0];
  const val = r => c.u === '%' ? pc(r.v) : fx(r.v, 1);
  return `<h2>In evidenza <small>${E.round ? E.round + 'ª giornata' : 'prossima giornata'}</small></h2>${tabs}
    <p class="lead">Chi spicca nelle statistiche previste per le partite della giornata: per ogni voce i primi 10.</p>
    <div class="seg" role="group" aria-label="Statistica">${E.cats.map((x, i) => `<button type="button" data-e="${i}" aria-pressed="${x === c}">${esc(x.l)}</button>`).join('')}</div>
    <p class="small muted">${esc(c.d)}.</p>
    <div class="list evl">${c.rows.map((r, i) => `<a class="card cardlink ev" href="#g${r.id}">
      <span class="rk num">${i + 1}</span>${crest(r.team, true)}
      <span class="evn"><b>${esc(r.name)}</b><small>${nm(r.team)} ${r.home ? 'vs' : '@'} ${nm(r.opp)} · ${day(r.start)}${r.official ? ' · <span class="uff">ufficiale</span>' : ''}</small></span>
      <span class="evv num">${val(r)}</span></a>`).join('')}</div>
    <p class="small muted">Solo i titolari previsti. I numeri tengono conto dei minuti previsti, dell'avversario, di chi marca chi e dell'arbitro, e sommano ai totali realistici di ogni squadra. Si aggiornano con le probabili formazioni e poi con quelle ufficiali, circa un'ora prima di ogni partita: chi ha già la formazione ufficiale è segnato con «ufficiale». Tocca un giocatore per aprire la sua scheda, con le previsioni per la partita.</p>`;
}
const VIEWS = {giornata: vGiornata, evidenza: vEvidenza, classifica: vClassifica, squadre: vSquadre, storico: vStorico, cerca: vCerca};
function show(name) {
  // #p123 = partita, #s123 = squadra, #g123 = giocatore, #r123 = com'è andata una partita dello storico
  const m = /^([psgr])(e?-?\d+)$/.exec(name || '');   // le partite nuove di ESPN hanno id come e401875056
  const view = m ? null : VIEWS[name] ? name : 'giornata';
  for (const k of Object.keys(VIEWS)) {
    const el = document.getElementById(k);
    el.hidden = k !== view;
    if (k === view) el.innerHTML = VIEWS[k]();
  }
  const det = document.getElementById('dettaglio');
  det.hidden = !m;
  det.innerHTML = m ? {p: vPartita, s: vSquadra, g: vGiocatore, r: vRivedi}[m[1]](m[2]) : '';
  const cur = m ? {p: 'giornata', s: 'squadre', g: '', r: 'storico'}[m[1]] : view;
  document.querySelectorAll('#nav a').forEach(a => a.setAttribute('aria-current', a.dataset.s === cur ? 'page' : 'false'));
  if (m) window.scrollTo(0, 0);
  if (view === 'cerca') { const q = document.getElementById('q'); if (q) q.focus(); }
}
document.addEventListener('click', e => {
  const v = e.target.closest('[data-e]');
  if (v) { esel = +v.dataset.e; document.getElementById('evidenza').innerHTML = vEvidenza(); }
  const g = e.target.closest('[data-eg]');
  if (g && g.dataset.eg !== egrp) { egrp = g.dataset.eg; esel = 0; document.getElementById('evidenza').innerHTML = vEvidenza(); }
  const m = e.target.closest('[data-em]');
  if (m) { emode = m.dataset.em; document.getElementById('evidenza').innerHTML = vEvidenza(); }
});
window.addEventListener('hashchange', () => { if (D) show(location.hash.slice(1)); });
const FONTE = {'statistiche': 'Understat', 'fantacalcio.it': 'Fantacalcio.it', 'sito': 'pubblicazione del sito',
               'storico': 'copia dello storico', 'designazioni': 'designazioni arbitrali (Fantacalcio.it)',
               'arbitri': 'arbitri della scorsa stagione (Fantacalcio.it)'};
function stamp() {
  // il sito si ripubblica ogni 30 minuti anche senza novità: se l'ora è vecchia, gli aggiornamenti si sono fermati
  const errs = Object.keys(D.errors || {}).map(k => FONTE[k] || k);
  const late = Date.now() / 1000 - D.generatedAt > 70 * 60;
  document.getElementById('stamp').innerHTML = `Aggiornato il ${day(D.generatedAt)}`
    + (late ? `<br><span class="warn">nessun aggiornamento da più di un'ora</span>` : '')
    + (errs.length ? `<br><span class="warn">non risponde: ${esc(errs.join(', '))}</span>` : '');
}
async function boot() {
  const box = document.getElementById('giornata');
  try {
    D = JSON.parse(document.getElementById('dati').textContent || 'null');
    if (!D) {
      box.innerHTML = '<p class="lead">Carico i dati…</p>';
      const r = await fetch('dati.json', {cache: 'no-store'});
      if (!r.ok) throw new Error(r.status);
      D = await r.json();
    }
  } catch (e) {
    box.innerHTML = '<p class="lead">I dati non si sono caricati: ricarica la pagina tra qualche secondo.</p>';
    return;
  }
  T = D.teams;
  // lega di questa pagina e collegamenti alle altre (la Serie A in cima al sito, le altre in una sottocartella)
  LG = D.league || {name: 'Serie A', dir: ''}; LGN = LG.name || 'Serie A';
  document.querySelector('.logo').innerHTML = `${esc(LGN)} <span>tascabile</span>`;
  document.querySelector('.logo').classList.toggle('long', LGN.length > 10);
  const up = LG.dir ? '../' : '';
  document.getElementById('leghe').innerHTML = (D.leagues || []).length > 1 ? D.leagues.map(l => `<a href="${up + (l.dir ? l.dir + '/' : '') || './'}" aria-current="${l.dir === LG.dir ? 'page' : 'false'}">${esc(l.name)}</a>`).join('') : '';
  D.players = D.players || [];
  PL = Object.fromEntries(D.players.map(p => [String(p.id), p]));
  LOGOS = new Set((D.logos || []).map(String));
  MK = Object.fromEntries((D.metrics || []).map(x => [x.k, x]));
  stamp();
  document.getElementById('foot').textContent = `Versione tascabile di ${LGN}, aggiornata in automatico ogni 30 minuti. Risultati, classifica, formazioni e statistiche delle partite da ESPN; xG da Understat; ${LG.fantacalcio === false ? 'probabili formazioni da OneFootball; allenatori da Wikipedia' : 'voti, probabili formazioni e designazioni arbitrali da Fantacalcio.it'}. I pronostici sono stime statistiche, non certezze.`;
  show(location.hash.slice(1) || 'giornata');
}
boot();
</script>
